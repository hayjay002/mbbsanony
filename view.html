<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>View Messages - MBBSAnonymous</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&family=Roboto&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Roboto', sans-serif;
  background: #0F111A;
  color: #ECECEC;
  padding: 20px;
}

h1 {
  font-family: 'Poppins', sans-serif;
  text-align: center;
  color: #4FA3F7;
}

/* Login */
.login-box {
  max-width: 360px;
  margin: 40px auto 20px;
  padding: 20px;
  border-radius: 18px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.2);
  text-align: center;
}

.login-box input {
  width: 100%;
  padding: 12px;
  margin-bottom: 10px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.05);
  color: #ECECEC;
}

.login-box button {
  width: 100%;
  padding: 10px;
  border-radius: 12px;
  border: none;
  font-weight: bold;
  background: linear-gradient(45deg,#4FA3F7,#28B463);
  color: white;
  cursor: pointer;
}

#loginError {
  color: #ff7b7b;
  font-size: 13px;
  margin-top: 6px;
}

/* Hide app until logged in */
body:not(.logged-in) #app {
  display: none;
}

/* Search */
#search {
  width: 100%;
  max-width: 500px;
  padding: 12px 15px;
  margin: 20px auto;
  display: block;
  border-radius: 15px;
  border: 1px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.05);
  color: #ECECEC;
}

/* Alert */
#newAlert {
  display: none;
  text-align: center;
  margin-bottom: 10px;
  color: #28B463;
  font-weight: bold;
}

/* Grid */
.messages {
  display: grid;
  grid-template-columns: repeat(auto-fill,minmax(220px,1fr));
  gap: 20px;
}

/* Card */
.card {
  aspect-ratio: 1 / 1;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 18px;
  padding: 18px;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.card p {
  text-align: center;
  font-size: 15px;
  line-height: 1.4;
  word-break: break-word;
}

.timestamp {
  margin-top: 10px;
  font-size: 11px;
  color: #B0B0B0;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox" class="login-box">
  <input id="username" placeholder="Username">
  <input id="password" type="password" placeholder="Password">
  <button id="loginBtn">Login</button>
  <p id="loginError"></p>
</div>

<!-- APP -->
<div id="app">
  <h1>Anonymous Messages</h1>

  <input id="search" placeholder="Search messages...">

  <div id="newAlert">🔔 New message received</div>

  <div class="messages" id="messagesContainer"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, orderBy, query } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

/* Login creds */
const ADMIN_USER = "admin";
const ADMIN_PASS = "1234";

const firebaseConfig = {
  apiKey: "AIzaSyC0OXKYEwh7aNeAZ2JkY8Q-WdOCr_MTApg",
  authDomain: "anonymous0000-bbbe.firebaseapp.com",
  projectId: "anonymous0000-bbbe",
  storageBucket: "anonymous0000-bbbe.appspot.com",
  messagingSenderId: "569708942202",
  appId: "1:569708942202:web:00e0f96d314da5f5c37cc3"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const container = document.getElementById("messagesContainer");
const search = document.getElementById("search");

/* Login */
const loginBox = document.getElementById("loginBox");
const loginBtn = document.getElementById("loginBtn");
const loginError = document.getElementById("loginError");

loginBtn.onclick = () => {
  const u = document.getElementById("username").value;
  const p = document.getElementById("password").value;

  if (u === ADMIN_USER && p === ADMIN_PASS) {
    document.body.classList.add("logged-in");
    loginBox.style.display = "none";
    loadMessages();
  } else {
    loginError.textContent = "Wrong username or password";
  }
};

let allMessages = [];

/* Alert */
function showNewMessageAlert() {
  document.getElementById("newAlert").style.display = "block";
}

/* Real-time messages */
function loadMessages() {
  const q = query(collection(db, "messages"), orderBy("timestamp", "desc"));

  onSnapshot(q, (snapshot) => {
    const newMessages = snapshot.docs.map(d => ({
      id: d.id,
      ...d.data()
    }));

    if (allMessages.length && newMessages.length > allMessages.length) {
      showNewMessageAlert();
    }

    allMessages = newMessages;
    render(allMessages);
  });
}

/* Render */
function render(list) {
  container.innerHTML = "";

  list.forEach(m => {
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <p>${m.text || ""}</p>
      <div class="timestamp">${m.timestamp?.toDate?.().toLocaleString() || ""}</div>
    `;

    container.appendChild(card);
  });
}

/* Search */
search.addEventListener("input", () => {
  const t = search.value.toLowerCase();
  render(allMessages.filter(m => (m.text || "").toLowerCase().includes(t)));
});
</script>

</body>
</html>
